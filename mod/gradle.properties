# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Java 25 is required: Minecraft 26.x class files are major version 69.
# Gradle finds it via the toolchain resolver (foojay, declared in settings.gradle).
# If your JDK 25 lives somewhere Gradle cannot auto-detect, set the path in your
# own ~/.gradle/gradle.properties instead of here — a machine-specific path in a
# shared file breaks the build for everyone else.
#   org.gradle.java.installations.paths=/path/to/jdk-25

mod_id=armorrestore
mod_name=Armor Restore
mod_version=0.1.0
mod_group_id=com.mcfreegod.armorrestore
minecraft_version=26.3
neoforge_version=26.3.0.48-beta
