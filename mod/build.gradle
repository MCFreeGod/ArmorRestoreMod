plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${project.mod_version}-${project.minecraft_version}"
group = project.mod_group_id

base {
    // Platform suffix keeps the two platform jars distinguishable, since both are
    // published under the same mod id. No brackets or spaces: GitHub rewrites any
    // character outside [A-Za-z0-9._-] in release asset names, which would turn
    // "[NeoForge] armorrestore.jar" into "NeoForge.armorrestore.jar".
    // Gradle appends "<version>" automatically, so only the base name goes here.
    archivesName = "${project.mod_id}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
            // Opt-in runtime verification: ./gradlew runServer -Pselftest
            if (project.hasProperty('selftest')) {
                jvmArgument '-Darmorrestore.selftest=true'
            }
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    // Optional China mirror, same switch as in settings.gradle. MDG resolves the
    // NeoForge artifacts itself, but user projects still pull from here.
    if (providers.gradleProperty('cnMirror').isPresent()) {
        maven {
            name = 'NeoForgedMirror'
            url = 'https://bmclapi2.bangbang93.com/maven'
            content {
                includeGroupByRegex 'net\\.neoforged.*'
                includeGroup 'net.minecraftforge'
            }
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// MDG does not expose Minecraft on the test classpath by default, and its dedicated
// `neoForge.unitTest` support pulls net.neoforged.fancymodloader:junit-fml, which is not
// published to any reachable repository. Reusing the main classpath is enough here: the
// tests only construct Components, and TranslatableContents' dev-time argument validation
// is skipped when FML is absent.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            mod_id             : project.mod_id,
            mod_name           : project.mod_name,
            mod_version        : project.mod_version,
            minecraft_version  : project.minecraft_version,
            neoforge_version   : project.neoforge_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/resources/modmetadata'
}

sourceSets.main.resources {
    srcDir generateModMetadata
}

neoForge.ideSyncTask generateModMetadata

// Ship the licence inside the jar: MIT requires the notice to travel with
// copies of the software, and mod files get passed around on their own.
// This project is its own Gradle root, so the licence is read from the parent
// directory that holds both platform projects.
tasks.named('jar') {
    def licence = file('../LICENSE')
    if (licence.exists()) {
        from(licence) {
            rename { 'LICENSE-armorrestore' }
        }
    }
}
